controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheel_separation: 0.40
    wheel_radius: 0.075
    wheel_separation_multiplier: 1.03   # deliberate calibration error (set 1.0 to remove)
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: false               # the EKF publishes odom -> base_footprint now
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    linear.x.max_velocity: 0.8
    angular.z.max_velocity: 1.5
    pose_covariance_diagonal:  [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
